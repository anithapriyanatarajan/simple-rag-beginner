# Default values for rag-pipeline
replicaCount:
  crawler: 1
  parser: 1
  embedder: 1
  ragApi: 2

image:
  registry: localhost:5000
  tag: latest
  pullPolicy: IfNotPresent

resources:
  crawler:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  parser:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  embedder:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"
  ragApi:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"

qdrant:
  storage: 50Gi
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"

config:
  targetSite: "https://example.com"
  chunkSize: "2000"
  vectorDim: "1536"

ingress:
  enabled: true
  host: rag.example.com
  className: nginx

secrets:
  openaiApiKey: ""  # Set this via --set or values override
