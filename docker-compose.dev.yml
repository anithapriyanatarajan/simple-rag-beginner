services:
  # Qdrant Vector Database - Development
  qdrant-dev:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant-dev
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - rag-dev-network

  # Ollama AI Server - Development
  ollama-dev:
    image: ollama/ollama:latest
    container_name: rag-ollama-dev
    ports:
      - "11434:11434"
    volumes:
      - ollama_dev_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h  # Keep models in memory longer for dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rag-dev-network

volumes:
  ollama_dev_data:

networks:
  rag-dev-network:
    driver: bridge

# Override for development - uncomment to run app on host
# This allows hot-reloading during development
# 
# To use:
# 1. docker-compose -f docker-compose.dev.yml up -d qdrant-dev ollama-dev
# 2. export QDRANT_HOST=localhost
# 3. export GENERATIVE_ENDPOINT=http://localhost:11434
# 4. export EMBEDDING_ENDPOINT=http://localhost:11434
# 5. go run cmd/main.go
