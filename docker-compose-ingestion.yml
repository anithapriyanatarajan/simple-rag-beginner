version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: qdrant-ingestion
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334

  crawler:
    build:
      context: .
      dockerfile: cmd/crawler/Dockerfile
    container_name: crawler-ingestion
    ports:
      - "8081:8080"
    environment:
      - PARSER_URL=http://parser:8080
      - PORT=8080
    depends_on:
      - parser
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  parser:
    build:
      context: .
      dockerfile: cmd/parser/Dockerfile
    container_name: parser-ingestion
    ports:
      - "8082:8080"
    environment:
      - EMBEDDER_URL=http://embedder:8080
      - PORT=8080
    depends_on:
      - embedder
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  embedder:
    build:
      context: .
      dockerfile: cmd/embedder/Dockerfile
    container_name: embedder-ingestion
    ports:
      - "8083:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - PORT=8080
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  qdrant_storage:
    driver: local

networks:
  default:
    name: rag-ingestion-network
