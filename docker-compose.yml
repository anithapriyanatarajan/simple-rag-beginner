services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334

  crawler:
    build:
      context: .
      dockerfile: cmd/crawler/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - PARSER_URL=http://parser:8080
    depends_on:
      - parser

  parser:
    build:
      context: .
      dockerfile: cmd/parser/Dockerfile
    ports:
      - "8082:8080"
    environment:
      - CHUNK_SIZE=2000
      - EMBEDDER_URL=http://embedder:8080
    depends_on:
      - embedder

  embedder:
    build:
      context: .
      dockerfile: cmd/embedder/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_DIM=1536
    depends_on:
      - qdrant

  rag-api:
    build:
      context: .
      dockerfile: cmd/rag-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-3.5-turbo}
      - LLM_API_KEY=${LLM_API_KEY:-${OPENAI_API_KEY}}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-500}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      
      # Embedding Configuration
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-ada-002}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-${OPENAI_API_KEY}}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1536}
      
      # Vector DB Configuration
      - QDRANT_URL=http://qdrant:6333
      
      # Processing Configuration
      - CHUNK_SIZE=${CHUNK_SIZE:-2000}
      - TOP_K=${TOP_K:-5}
      
      # Legacy support
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - qdrant

volumes:
  qdrant_data:
